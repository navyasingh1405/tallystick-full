# Cross-reference between validation pack sections and the regulatory frameworks
# they are written against. Drives appendix 12 of the pack.
#
# These are pointers, not quotations. Verify current text before relying on them.

frameworks:
  sr117:
    label: "Fed SR 11-7 / OCC 2011-12 — Supervisory Guidance on Model Risk Management"
    note: >-
      Three pillars: conceptual soundness of development, ongoing monitoring, and
      outcomes analysis. Applies to banking organizations supervised by the Federal
      Reserve and the OCC.
  eu_ai_act:
    label: "EU AI Act — Annex III 5(b), Article 11 / Annex IV, Article 12, Article 14"
    note: >-
      Creditworthiness assessment and credit scoring of natural persons are classified
      high-risk under Annex III point 5(b). Article 11 and Annex IV set technical
      documentation content; Article 12 covers logging; Article 14 covers human
      oversight. Standalone Annex III obligations were deferred to 2 December 2027 by
      the Digital Omnibus (Council final approval 29 June 2026). The deferral moved the
      deadline, not the workload — conformity assessment on a high-risk system runs
      closer to a year than a quarter.
  ecoa:
    label: "ECOA / Regulation B — 12 CFR 1002"
    note: >-
      Section 1002.9 governs adverse action notification: the notice must state the
      specific principal reasons for the action. Model complexity does not excuse
      generic reasons.
  fcra:
    label: "FCRA — 15 U.S.C. 1681"
    note: >-
      Where a consumer report informs the decision, additional disclosure duties attach
      under sections 615(a) and 609(g). This system uses no consumer report data, so
      those disclosures are inapplicable and are deliberately omitted rather than
      included as boilerplate.

