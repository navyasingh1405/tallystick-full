[project]
name = "tallystick"
version = "0.1.0"
description = "Governance layer around a credit model: reproducible decisions, regulator-ready reason codes, fairness testing as code, self-generating validation pack."
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1.0",
    # pandas 3.0 changes the default string dtype and copy semantics; shap 0.46 and
    # statsmodels 0.14 predate it and hit subtle groupby/indexing breakage there.
    "pandas>=2.2.0,<3.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26,<2.2",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "lightgbm==4.5.0",
    "shap==0.46.0",
    "statsmodels>=0.14.2",
    "matplotlib>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "playwright>=1.47.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "pypdf>=5.0.0",
    "argon2-cffi>=25.1.0",
]

[project.scripts]
tally = "tally.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires trained model or real data",
    "needs_data: requires downloaded HMDA data",
    "needs_model: requires a trained model in the registry",
    "needs_chromium: requires playwright chromium",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
